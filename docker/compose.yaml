services:
  px4_sim:
    build:
      context: ./px4_sim/
      network: host   # ros2 와 같은 이유 (위 주석 참고)
    container_name: drobot_px4_sim
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - LOCAL_USER_ID=${UID}
      - LOCAL_GROUP_ID=${GID}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ../:/app
    devices:
      - /dev/dri
    network_mode: host
    stdin_open: true
    tty: true
    # GPU 사용 시 nvidia-container-toolkit 필요:
    # sudo apt install nvidia-container-toolkit
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]

  ros2:
    build:
      context: ./ros2/
      # 빌드 중 호스트 네트워크를 쓴다.
      # packages.ros.org 가 DNS에서 IPv6 주소만 주는데 Docker 기본 브리지는
      # IPv6 를 못 써서 IPv4(140.211.166.134)로 폴백하고, 그 경로가 막혀 있다.
      # 실제로 ros-jazzy-rqt-gui 다운로드에서 Connection timed out 이 반복됐다.
      network: host
    container_name: drobot_ros2
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - LOCAL_USER_ID=${UID}
      - LOCAL_GROUP_ID=${GID}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ../:/app
    devices:
      - /dev/dri
    network_mode: host
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
