services:
  px4_sim:
    build:
      context: ./px4_sim/
      network: host   # ros2 와 같은 이유 (위 주석 참고)
    container_name: drobot_px4_sim
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - LOCAL_USER_ID=${UID}
      - LOCAL_GROUP_ID=${GID}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ../:/app
    devices:
      - /dev/dri
    # GPU 디바이스 그룹 — 컨테이너 안 사용자(uid 1000)를 호스트의 video/render 에 넣는다.
    #
    # 호스트에서 usermod -aG video,render 해도 컨테이너 내부 그룹은 별개라
    # /dev/dri/renderD128 을 못 읽는다. 그러면 Gazebo 가
    #     libEGL warning: failed to open /dev/dri/renderD128: Permission denied
    # 를 내며 소프트웨어 렌더링으로 떨어지고, 느려진 탓에 /clock 발행이 밀려
    # ekf_node 가 "Waiting for clock to start..." 에서 멈춘다.
    # 그 결과 odom TF 가 안 나와 컨트롤러가 로봇을 못 움직인다.
    #
    # 숫자는 호스트의 GID 다 (detop: video=44, render=992).
    # 다른 머신이면 `getent group video render` 로 확인해 바꿀 것.
    group_add:
      - "44"
      - "992"
    network_mode: host
    stdin_open: true
    tty: true
    # GPU 사용 시 nvidia-container-toolkit 필요:
    # sudo apt install nvidia-container-toolkit
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]

  ros2:
    build:
      context: ./ros2/
      # 빌드 중 호스트 네트워크를 쓴다.
      # packages.ros.org 가 DNS에서 IPv6 주소만 주는데 Docker 기본 브리지는
      # IPv6 를 못 써서 IPv4(140.211.166.134)로 폴백하고, 그 경로가 막혀 있다.
      # 실제로 ros-jazzy-rqt-gui 다운로드에서 Connection timed out 이 반복됐다.
      network: host
    container_name: drobot_ros2
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - LOCAL_USER_ID=${UID}
      - LOCAL_GROUP_ID=${GID}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ../:/app
    devices:
      - /dev/dri
    # GPU 디바이스 그룹 — 컨테이너 안 사용자(uid 1000)를 호스트의 video/render 에 넣는다.
    #
    # 호스트에서 usermod -aG video,render 해도 컨테이너 내부 그룹은 별개라
    # /dev/dri/renderD128 을 못 읽는다. 그러면 Gazebo 가
    #     libEGL warning: failed to open /dev/dri/renderD128: Permission denied
    # 를 내며 소프트웨어 렌더링으로 떨어지고, 느려진 탓에 /clock 발행이 밀려
    # ekf_node 가 "Waiting for clock to start..." 에서 멈춘다.
    # 그 결과 odom TF 가 안 나와 컨트롤러가 로봇을 못 움직인다.
    #
    # 숫자는 호스트의 GID 다 (detop: video=44, render=992).
    # 다른 머신이면 `getent group video render` 로 확인해 바꿀 것.
    group_add:
      - "44"
      - "992"
    network_mode: host
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
