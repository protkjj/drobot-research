# Nav2 설정 — proposed (에너지 인식 2.5D 하이브리드 A*)
#
# nav2_params.yaml(baseline: SmacPlanner2D)에서 파생한 파일이다.
# 바뀐 곳은 두 군데뿐이다:
#   1. global_costmap 에 elevation_layer 추가
#   2. planner_server 의 GridBased 를 HybridAStarPlanner 로 교체
#
# baseline 비교 실험(logging_config.yaml 의 planners 목록)을 위해
# 원본 nav2_params.yaml 은 그대로 둔다.
#   smac2d          -> nav2_params.yaml
#   proposed        -> 이 파일

# =============================================================================
# Nav2 Parameters for Drobot - 목표 기반 자율주행 (Goal Navigation)
# =============================================================================
# 용도: drobot_bringup/launch/navigation.launch.py
# 특징: 빠르고 공격적, 장애물 회피 강화
# =============================================================================

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    transform_tolerance: 1.0          # 시뮬레이션용 TF 허용 오차
    bt_loop_duration: 10
    default_server_timeout: 30        # 서버 타임아웃 증가
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    # 커스텀 BT: 막히면 재계획! (패키지 share 경로에서 로드)

# =============================================================================
# Controller Server (로컬 플래너)
# =============================================================================
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2      # 0.3→0.2 (더 민감하게)
      # 모드 전환(이착륙) 중에는 로봇이 지상에서 안 움직이는 게 정상이다.
      # mode_manager 가 비행 구간을 수행하는 동안 /speed_limit 으로 지상
      # 컨트롤러를 묶는데, 그 시간이 이 허용치를 넘으면 Nav2 가 "막혔다"고
      # 판단해 목표를 포기한다 (실제로 13.6초 비행 중 10초에서 aborted).
      #
      # 비행 1회 최대 소요 = 이륙 5 + 순항(최대 5.0 m / 0.5 m/s = 10) + 착륙 4
      #                   = 19초  (energy_params.yaml · robot_physical.yaml 기준)
      # 거기에 여유를 둬 30초로 잡는다. 2026-10-01
      movement_time_allowance: 30.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.75       # 75cm 도착 인식 범위
      yaw_goal_tolerance: 3.14      # yaw 제한 없음 (방향 무관하게 도착 인식)
      stateful: true

    # Rotation Shim: 경로 시작 방향과 로봇 heading 차이가 크면 제자리 회전 후 출발
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "dwb_core::DWBLocalPlanner"
      # 경로 방향과 이 각도 이상 차이나면 전진을 멈추고 제자리 회전 (rad).
      # 이력: 0.1(5.7°) → 회전이 수렴 못 함 (멈추는 데 필요한 각 1.5^2/(2*5.0)
      #       = 0.225 rad > 허용 0.1 rad 이라 매번 넘어가 재회전, 2026-10-02)
      #       → 0.785(45°, Nav2 기본값)
      #       → 1.75(100°). 2026-10-05
      #
      # 0.785 였을 때 코너에서 막혔다. 이유:
      #   - 플래너가 0.5 s 마다 재계획하므로 경로 시작점이 항상 로봇이다.
      #     즉 shim 이 주행 내내, 코너에서도 계속 개입한다.
      #   - 코너는 약 90° 꺾이므로 45° 임계를 가볍게 넘어 그 자리에서
      #     제자리 회전을 시도한다.
      #   - 제자리 회전은 footprint 외접 반경 0.3015 m 를 쓸어낸다. 실측한
      #     복도 병목 여유는 0.350 m 라 남는 margin 이 4.9 cm 뿐이다.
      #   - RotationShimController 는 회전이 충돌하면 primary 로 넘기지 않고
      #     예외를 던진다 → FollowPath 실패 → 복구 루프.
      #
      # 같은 자리를 '직진으로 통과'하는 데 필요한 건 내접 반경 0.195 m 뿐이고,
      # margin 이 15.5 cm 로 3 배 넉넉하다. 그러니 코너는 제자리 회전이 아니라
      # 호(arc)로 돌아야 한다. DWB 는 호를 만들 수 있고 충돌하는 궤적은
      # critic 점수에서 탈락시켜 다른 걸 고르므로 실패를 던지지 않는다.
      #
      # 1.75 rad = 100° — "경로가 사실상 내 뒤쪽일 때만 제자리 회전" 이라는
      # 정책. 출발 시 반대 방향을 보고 있는 경우(넓은 곳)는 그대로 처리되고,
      # 코너(약 90°)는 DWB 가 호로 돈다.
      angular_dist_threshold: 1.75
      forward_sampling_distance: 1.0  # 경로 앞 1.0m 지점 방향 기준 (재계획 시 heading 흔들림 감소)
      rotate_to_heading_angular_vel: 1.5  # 제자리 회전 속도 (rad/s)
      max_angular_accel: 5.0          # 회전 가속 제한
      # 속도 제한 (+30% 추가!)
      min_vel_x: 0.0              # DWB 경로추종은 전진만 (후진은 BackUp 복구에서 처리)
      max_vel_x: 0.4
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 1.5            # 회전 속도 (~86°/s)
      min_speed_xy: 0.0
      max_speed_xy: 0.4
      min_speed_theta: 0.5          # 0→직진 시 미세보정 허용 (Spin은 behavior_server에서 별도 제어)
      # 가속 제한
      acc_lim_x: 0.5
      acc_lim_y: 0.0
      acc_lim_theta: 5.0            # 부드러운 회전 가속
      decel_lim_x: -0.5
      decel_lim_theta: -5.0
      # 샘플링
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 40            # 회전 샘플 증가 (더 세밀한 회전 탐색)
      # sim_time: 2.5 → 1.5. 2026-10-05
      # DWB 는 sim_time 동안 (vx, vtheta) 를 고정한 '원호 하나' 만 그린다.
      # 2.5 s × max_vel_x 0.4 = 1.0 m 짜리 원호인데, 코너에서 1 m 단일 원호는
      # 안쪽을 자르거나 바깥으로 부풀어 거의 전부 벽에 걸린다. ObstacleFootprint
      # 가 그걸 무효로 만들어 살아남는 궤적이 극소수가 되고, 로봇이 코너 앞에서
      # 한참 머뭇거리다 겨우 지나갔다 (2026-10-05 실측).
      # 1.5 s × 0.4 = 0.6 m 로 줄이면 코너에 들어맞는 원호가 많아진다.
      # 매 주기 재계획하므로 멀리 보지 못해 손해 보는 건 적다.
      # 2.5 로 올렸던 목적("미리 회전 시작")은 이제 angular_dist_threshold 가 맡는다.
      sim_time: 1.5
      transform_tolerance: 1.0        # 시뮬레이션용 TF 허용 오차
      xy_goal_tolerance: 0.50
      # Critics - 장애물 회피 강화!
      # ObstacleFootprint 추가. 2026-10-05
      # BaseObstacle 은 로봇 '중심점' 한 칸의 cost 만 본다. 몸통은 보지 않는다.
      # 보통은 인플레이션의 inscribed(253) 띠가 그 역할을 대신하지만, inscribed
      # 반경은 방향을 모르는 '내접원'이라 긴 로봇에서 구멍이 생긴다:
      #     내접 반경      0.195 m  (footprint 반폭)
      #     로봇 반길이    0.230 m  (중심 → 코)
      # 즉 벽을 정면으로 본 자세에서 중심이 0.20 m 떨어져 있으면 253 밖이라
      # '합법'인데, 코는 이미 벽 안으로 3.5 cm 들어가 있다. DWB 가 그 궤적을
      # 유효로 보고 명령을 내 로봇이 벽을 밀고, 바퀴가 타고 올라가 뒤집혔다.
      # ObstacleFootprint 는 자세(회전)까지 반영한 실제 footprint 다각형을
      # costmap 에 대고 검사해 충돌 궤적을 무효로 만든다.
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "ObstacleFootprint", "PathAlign", "PathDist", "GoalDist"]
      # ObstacleFootprint.scale: 1.0 → 0.2. 2026-10-05
      # 이 critic 은 충돌을 무효 처리하기도 하지만, 충돌이 아닌 칸의 인플레이션
      # 비용도 비례해 더한다. 1.0 은 근거 없이 넣은 값이었고 Nav2 기본(0.02)의
      # 50 배였다. 실측(/evaluation, 코너 앞 정지 상태):
      #     느린 궤적(선택됨) : GoalDist 39×0.25        = 9.75
      #     빠른 전진 궤적    : ObstacleFootprint 220×0.05 = 11.00  (GoalDist 0)
      # 즉 목표에 도달하는 궤적이 '벽에 가깝다'는 통행료 11 을 물어 정지(9.75)에
      # 졌다. 좁은 복도에서는 어떤 경로든 인플레이션을 지나므로, 통행료가 진행
      # 이득보다 비싸면 로봇은 서 있는 쪽을 고른다 — 코너 앞 대기의 원인.
      #
      # 주의: MapGrid 계열 critic 의 실제 scale 은 YAML 값이 아니다.
      #   PathAlign/PathDist/GoalDist : resolution × 0.5 × scale = 0.05×0.5×10 = 0.25
      #   ObstacleFootprint           : resolution × scale       = 0.05×1.0    = 0.05
      # 상한 계산: 비-치명 최대 cost 252 × 0.05 × scale < 진행 이득(~9.75)
      #            → scale ≤ 0.3. 0.2 면 최대 통행료 2.5 로 선호는 남고 진행을
      #            막지는 않는다.
      # 0.2 로도 부족했다. 실측(/evaluation, 코너 앞):
      #     선택됨  vx=0.063 : GoalDist 10.25                      = 10.25
      #     빠른전진 vx=0.316 : Obst 2.53 + PathDist 0.25 + Goal 8.75 = 11.53
      # 전진으로 버는 GoalDist 이득이 1.50 뿐인데 통행료가 2.53 이라 여전히
      # 정지가 이겼다. 통행료 raw 는 253 — footprint 가 inscribed 띠를 덮는다는
      # 뜻이고, 복도 여유 0.35 m / 로봇 반폭 0.195 m 에서는 어떤 자세로도
      # 덮을 수밖에 없다. 즉 피할 수 없는 고정비다.
      #
      # 이 critic 을 '부드러운 선호' 로 쓰면 안 된다. 벽에서 떨어지는 것이
      # 불가능한 복도에서 "떨어져라" 에 값을 매기면 정지가 늘 최적이 된다.
      # 이 critic 의 역할은 충돌 무효 처리(하드)이고 그건 scale 과 무관하다.
      # Nav2 기본값 0.02 로 둔다 → 통행료 253×0.05×0.02 = 0.25.
      ObstacleFootprint.scale: 0.02
      Oscillation.scale: 1.0           # 진동 방지
      BaseObstacle.scale: 0.5         # 장애물 회피
      PathAlign.scale: 10.0
      PathAlign.forward_point_distance: 0.5   # 0.3→0.5 (더 앞의 경로에 정렬 → 부드러운 커브)
      PathDist.scale: 10.0
      GoalDist.scale: 10.0
      RotateToGoal.scale: 2.0
      RotateToGoal.slowing_factor: 2.0

# =============================================================================
# Local Costmap (실시간 장애물 감지)
# =============================================================================
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: true
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # footprint — 메시에서 직접 측정한 실제 외곽. 2026-10-05
      # drobot.urdf.xacro 의 조인트 체인을 적용해 base_link + 암 4 + 사이드프레임 2
      # + 바퀴 4 의 collision 메시를 전부 base_link 기준으로 변환한 결과:
      #     길이(x) -0.228~+0.229 = 0.457 m,  폭(y) -0.193~+0.187 = 0.379 m
      #     원점 기준 최대 XY 반경 0.297 m (제자리 회전 시 쓸어내는 반경)
      # 이전 주석의 "로봇 실제 0.30 x 0.40m" 은 틀린 값이었다. 바퀴가 앞뒤로
      # ±0.229 까지 뻗어 실제로는 그보다 길다.
      # 여기에 패딩을 더하지 않는다 — 외접 반경이 커져 좁은 곳에서 회전이
      # 불가능해진다. 안전마진은 inflation_layer 가 담당한다.
      footprint: "[[0.23, 0.195], [0.23, -0.195], [-0.23, -0.195], [-0.23, 0.195]]"
      # elevation_layer 를 다시 넣었다. 2026-10-04
      # 뺐던 이유(2026-10-02): ElevationLayer 가 rolling window 를 지원하지 않아,
      # 로봇을 따라 움직이는 이 창에서 원점이 처음 위치에 고정된 채 같은 칸 번호를
      # 써서 높이가 엉뚱한 칸에 찍히고 쌓였다. RViz 에서 빈 바닥이 보라색 덩어리로
      # 뒤덮였고, 컨트롤러가 그걸 피하느라 명령의 64% 가 제자리 회전,
      # 205 s 에 3 m 를 갔다.
      # 해결: ElevationLayer 에 updateOrigin() 오버라이드를 구현했다. 창 원점이
      # 이동하면 높이 격자(cells_)를 베이스가 costmap_ 를 옮기는 것과 동일한
      # 규칙(cell_ox/cell_oy, 겹침 영역)으로 재매핑한다. 고정 창(global)에서는
      # isRolling()==false 라 동작이 바뀌지 않는다.
      # 이제 컨트롤러도 2.5D 지형 등급(flyover=200)을 실시간으로 본다.
      plugins: ["voxel_layer", "elevation_layer", "inflation_layer"]

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          inf_is_valid: true    #adding valid value for empty space
          raytrace_max_range: 3.0
          raytrace_min_range: 0.3
          obstacle_max_range: 2.5
          obstacle_min_range: 0.3

      # 2.5D elevation (local) — MPPI 가 지형 cost(200=flyover 등)를 읽도록 global 과 동일 배선.
      # 파라미터는 global 과 동일하게 유지 (SSOT 기준: elevation_params.yaml).
      elevation_layer:
        plugin: "drobot_costmap_2_5d::ElevationLayer"
        enabled: true
        height_thresholds:
          rover_traversable_max: 0.15
          fly_over_max: 1.2
          # LiDAR 도 맞은 칸을 flyover 로 내릴 때 요구하는 카메라 측정 상한.
          # 전방 카메라는 가까운 큰 물체의 윗부분이 수직 FOV 를 벗어나 실제보다
          # 낮게 측정된다. LiDAR 가 단단한 반사를 준 칸에서 측정 높이가 이 값을
          # 넘으면 과소추정으로 보고 flyover 로 내리지 않는다 (벽 보호).
          confident_flyover_max: 0.6
        ceiling_height: 2.5            # ← SSOT: robot_physical.yaml
        robot_flight_height: 0.8       # ← SSOT: robot_physical.yaml (flight_clearance)
        min_ceiling_clearance: 0.5     # ← SSOT: robot_physical.yaml
        traversability:
          max_slope_angle: 15.0
          max_roughness: 0.03
          max_step_height: 0.05
        cost_values:
          free: 0
          rover_traversable: 100
          fly_over: 200
          impassable: 254
        use_pointcloud: true
        use_laserscan: true
        depth_topic: "/camera/depth/points"
        scan_topic: "/scan"
        min_obstacle_height: -0.5
        max_obstacle_height: 3.0
        max_sensor_range: 4.0
        publish_elevation_grid: false  # local 은 디버그 발행 생략 (global 에서 확인)
        clear_on_reset: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0      # 높을수록 lethal 근처만 고비용
        inflation_radius: 0.25        # 최소 안전거리 (Global보다 작아서 유연함)

      always_send_full_costmap: true

# =============================================================================
# Global Costmap (경로 계획용) - 더 보수적인 설정!
# =============================================================================
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: true
      # footprint — 메시에서 직접 측정한 실제 외곽. 2026-10-05
      # drobot.urdf.xacro 의 조인트 체인을 적용해 base_link + 암 4 + 사이드프레임 2
      # + 바퀴 4 의 collision 메시를 전부 base_link 기준으로 변환한 결과:
      #     길이(x) -0.228~+0.229 = 0.457 m,  폭(y) -0.193~+0.187 = 0.379 m
      #     원점 기준 최대 XY 반경 0.297 m (제자리 회전 시 쓸어내는 반경)
      # 이전 주석의 "로봇 실제 0.30 x 0.40m" 은 틀린 값이었다. 바퀴가 앞뒤로
      # ±0.229 까지 뻗어 실제로는 그보다 길다.
      # 여기에 패딩을 더하지 않는다 — 외접 반경이 커져 좁은 곳에서 회전이
      # 불가능해진다. 안전마진은 inflation_layer 가 담당한다.
      # ↑ 글로벌(계획)에는 여기에 0.10 m 패딩을 더한 값을 쓴다. 2026-10-05
      # collides() 가 막는 INSCRIBED(253) 띠의 폭은 inflation_radius 가 아니라
      # footprint 의 내접 반경에서 나온다 (Nav2 가 footprint 로 계산한다).
      # 실측: 플래너가 낸 경로의 최소 벽 여유가 0.206 m 였다. 내접이 0.195 m 이니
      # 제어 오차에 쓸 margin 이 1.1 cm 뿐이고, 그래서 컨트롤러는 253 을 스치는
      # 궤적밖에 못 고른다 — 통행료를 높이면 멈추고 낮추면 벽을 긁는다.
      # 계획용 footprint 를 키우면 253 띠가 넓어져 플래너가 알아서 떨어져 돈다.
      #   계획 내접 0.295 m → margin 0.10 m
      # 통과해야 할 틈은 1.90 m (박스 x<=4.00 ~ 오른쪽벽 x>=5.90) 이므로
      # 양쪽에 0.295 를 빼도 중앙에 1.31 m 가 남는다.
      # 제어(로컬)는 실측값 그대로 둔다 — 충돌 판정은 실제 크기로 해야 한다.
      footprint: "[[0.33, 0.295], [0.33, -0.295], [-0.33, -0.295], [-0.33, 0.295]]"
      resolution: 0.05
      # static + obstacle + elevation + inflation
      # elevation_layer 는 obstacle_layer 뒤에 와야 한다 —
      # 2.5D 높이 판정이 2D 장애물 판정을 덮어쓸 수 있어야 하기 때문.
      # static_layer 를 뺐다.
      # SLAM 맵을 따라가면 아직 탐색 못 한 영역이 costmap 밖이 되어
      # 목표점을 찍을 수 없다 (planner: "목표점이 costmap 밖이다").
      # 벤치마크 맵은 크기를 이미 알고 있으므로 아래 width/height 로 고정한다.
      plugins: ["obstacle_layer", "elevation_layer", "inflation_layer"]

      # 맵 전체를 덮는 고정 costmap (rolling_window: false)
      # 벤치마크 맵 최대 크기는 24x16m — 여유를 둬서 30x20m 로 잡는다.
      rolling_window: false
      width: 30
      height: 20
      origin_x: -2.0
      origin_y: -2.0
      # 미탐색 영역을 장애물로 보지 않는다.
      # true 로 두면 로봇이 아직 못 본 곳을 통과 불가로 판단해 경로가 막힌다.
      track_unknown_space: false


      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          inf_is_valid: true      #adding valid value for empty space
          raytrace_max_range: 3.0
          raytrace_min_range: 0.3
          obstacle_max_range: 2.5
          obstacle_min_range: 0.3

      # 2.5D elevation — RGB-D + LiDAR 로 높이를 누적해 4단계 분류
      # 전체 파라미터 설명: drobot_costmap_2_5d/config/elevation_params.yaml
      elevation_layer:
        plugin: "drobot_costmap_2_5d::ElevationLayer"
        enabled: true
        height_thresholds:
          rover_traversable_max: 0.15
          fly_over_max: 1.2            # 천장 제약상 실제 통과 가능 높이에 맞춤
          # LiDAR 도 맞은 칸을 flyover 로 내릴 때 요구하는 카메라 측정 상한.
          # 전방 카메라는 가까운 큰 물체의 윗부분이 수직 FOV 를 벗어나 실제보다
          # 낮게 측정된다. LiDAR 가 단단한 반사를 준 칸에서 측정 높이가 이 값을
          # 넘으면 과소추정으로 보고 flyover 로 내리지 않는다 (벽 보호).
          confident_flyover_max: 0.6
        ceiling_height: 2.5            # ← SSOT: robot_physical.yaml
        robot_flight_height: 0.8       # ← SSOT: robot_physical.yaml (flight_clearance)
        min_ceiling_clearance: 0.5     # ← SSOT: robot_physical.yaml
        traversability:
          max_slope_angle: 15.0
          max_roughness: 0.03
          max_step_height: 0.05
        cost_values:
          free: 0
          rover_traversable: 100
          fly_over: 200
          impassable: 254
        use_pointcloud: true
        use_laserscan: true
        depth_topic: "/camera/depth/points"
        scan_topic: "/scan"
        min_obstacle_height: -0.5
        max_obstacle_height: 3.0
        max_sensor_range: 4.0
        publish_elevation_grid: true   # RViz 확인용
        clear_on_reset: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # ============================================================
        # ⚠️ 중요: 중앙 경로 선호 설정 - 절대 삭제 금지! ⚠️
        # ============================================================
        # cost_scaling_factor 낮으면 → 비용이 천천히 감소 → 중앙 선호
        # inflation_radius 넓으면 → 넓은 비용 그라디언트 생성
        # → 플래너가 장애물 사이 "중앙"으로 경로 생성!
        # ============================================================
        cost_scaling_factor: 2.0      # 낮을수록 벽 비용이 넓게 퍼짐 → 코너 여유 확보
        inflation_radius: 1.0         # 비용 그라디언트 범위 (0.8→1.0, 코너에서 더 넓게 돌기)

      always_send_full_costmap: true

# =============================================================================
# Planner Server (경로 계획)
# =============================================================================
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "drobot_hybrid_planner::HybridAStarPlanner"
      # 전체 파라미터 설명: drobot_hybrid_planner/config/hybrid_astar_params.yaml
      timeout: 2.0
      max_expansions: 2000000
      flight_clearance: 0.8            # ← SSOT: robot_physical.yaml
      max_flight_segment: 5.0          # ← SSOT: robot_physical.yaml (max_flight_distance)
      flight_distance_bin: 0.25
      ceiling_height: 2.5            # ← SSOT: robot_physical.yaml
      rover_traversable_max: 0.15
      flyover_representative_height: 0.60
      # 지형 등급을 읽을 레이어 — master 에서 읽으면 inflation 이 지형이 된다
      # (COST_HEIGHT_CONTRACT.md). 이 이름의 레이어가 없으면 master 로 떨어지며 경고한다.
      terrain_layer: "elevation_layer"
      land_only_on_observed: true      # 착륙은 카메라가 본 칸에만 (못 본 장애물 윗면 착륙 방지)
      allow_diagonal: true
      check_diagonal_corners: true     # false면 벽 모서리를 관통하는 경로가 나온다
      smooth_path: true
      smoothing_max_passes: 30
      publish_mode_switch_plan: true

# =============================================================================
# 에너지 모델 — "derived" 세트 (이착륙이 싼 쪽)
# 전체 설명: drobot_hybrid_planner/config/energy_params_derived.yaml
#
# default 와 값만 다르다:
#   이륙 5.0->0.5  착륙 3.0->0.3  고도 2.0->0.4  비행 2.0->0.6 (Wh)
# 전환 1회 고정비가 평지 16.0 m -> 1.6 m 로 줄어 비행이 실제로 선택된다.
# default 로는 벤치마크 5개 맵 전부에서 모드 전환이 0회였다.
# =============================================================================
    energy_model:
      cost_weights:
        w_energy: 0.5
        w_switch: 0.2
        w_time: 0.3
      ground_mode:
        energy_per_meter: 0.5
        speed: 0.3
      air_mode:
        energy_per_meter: 0.6
        hover_power: 50.0
        speed: 0.5
      climb_mode:
        max_height: 0.7
        energy_per_height_m: 2.0
        speed_factor: 0.4
      mode_switch:
        takeoff_energy: 0.5
        takeoff_time: 5.0
        landing_energy: 0.3
        landing_time: 4.0
        energy_per_altitude_meter: 0.4
      ground_effect:
        enabled: true
        activation_height: 0.5
        power_multiplier: 1.15
      vertical_motion:
        climb_energy_per_meter: 2.0
        descent_energy_ratio: 0.3
        climb_speed: 0.5
        descent_speed: 0.5
      apply_altitude_cost_to_landing: true
      robot:
        height: 0.25
        ceiling_margin: 0.5
      min_flight_clearance: 0.2
      max_climb_angle_deg: 45.0
      idle_power:
        enabled: false
        ground_w: 0.0
        air_w: 0.0

# =============================================================================
# Behavior Server (복구 동작)
# =============================================================================
behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # 복구 동작 추가: costmap 클리어!
    behavior_plugins: ["spin", "backup", "wait", "drive_on_heading"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 1.0
    max_rotational_vel: 1.5           # Spin 회전 속도
    min_rotational_vel: 0.4           # Spin 최소 회전 속도
    rotational_acc_lim: 2.0           # Spin 회전 가속도

# =============================================================================
# Velocity Smoother
# =============================================================================
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.4, 0.0, 2.0]
    min_velocity: [-0.2, 0.0, -1.5]
    max_accel: [1.0, 0.0, 3.0]
    max_decel: [-1.0, 0.0, -2.0]
    odom_topic: "odom"
    odom_duration: 0.1
