# 모드 전환 파라미터
# BT 커스텀 노드(CheckModeSwitch, ExecuteTakeoff, ExecuteLanding)에서 사용

mode_manager:
  ros__parameters:
    # 정지 확인 — 선속도가 이 값 미만이어야 전환 허용
    velocity_threshold: 0.05  # m/s

    # 전환 쿨다운 — 착륙 후 최소 대기 시간
    cooldown_after_landing: 3.0  # seconds

    # 배터리 강제 착륙 임계값
    battery_emergency_threshold: 15.0  # percent

    # 배터리 비행 허용 여유 — 1사이클 소모량 대비 이 비율 이상 잔량 필요
    battery_safety_margin: 1.2  # 20% 여유 = 1.2배

    # 비행 거리 상한 — 한 번에 최대 비행 가능 거리
    max_flight_distance: 5.0  # meters

    # 천장 여유 최소값 — 로봇 상단 기준
    min_ceiling_clearance: 0.5  # meters

    # ===== 전환 지점 판정 =====
    # 전환점에 이만큼 가까워지면 "도달"로 본다.
    # 너무 작으면 컨트롤러가 지나쳐버려 전환을 놓치고,
    # 너무 크면 엉뚱한 곳에서 이륙한다. 주행 해상도(0.1 m)의 3~4배로 잡았다.
    arrival_radius: 0.35  # meters

    # 이착륙 실행 백엔드
    #   sim — PX4 없이 시뮬에서 전환 (현재. 시뮬에 멀티콥터 물리가 없다)
    #   px4 — Phase 2 실물 오프보드
    backend: "sim"

    # ===== 좌표 프레임 =====
    # 규약(인터페이스 규약 ①)은 base_link 지만 저장소 실물은 base_footprint 다.
    # 규약 정렬은 A 트랙 몫이라 여기서는 파라미터로 받아 맞춰 쓴다.
    base_frame: "base_footprint"
    map_frame: "map"

    # ===== 배터리 (인터페이스 규약 C -> C) =====
    # energy_logger 가 /battery_state 로 내고 여기서 받는다.
    # 용량은 팩 사양 — 실측으로 교체할 것                        ← 실측
    battery_capacity_wh: 100.0

    # 배터리를 모를 때 이륙을 막을지.
    #   false — 시뮬. INA226 이 없어 present=false 로만 오므로 막으면 아무것도 못 한다
    #   true  — 실물(Phase 2). 모르는 채로 띄우면 안 된다
    require_battery: false

    # ===== 비행 실행 (단계 2) =====
    # 시뮬에 멀티콥터 물리가 없어 Gazebo 모델 자세를 직접 쓴다.
    # 이것은 비행 시뮬레이션이 아니라 운동학 재생이다 — backends.py 참고.
    world: "base_map_h0.5"      # set_pose 서비스 경로에 들어간다
    model_name: "drobot"

    # animate — dt 마다 자세를 다시 박는다. Nav2 가 로봇을 밀어내는 걸 덮는다
    # hop     — 이륙 대기 / 한 번 이동 / 착륙 대기. 전송이 느릴 때(CLI) 쓴다
    flight_style: "animate"
    flight_dt: 0.05             # s, animate 간격 (20Hz)

    # ⚠ energy_params.yaml 과 같아야 하는 값. 다르면 계획과 실행이 어긋난다.
    #    시작할 때 자동으로 대조해서 불일치면 경고가 뜬다 (_check_ssot).
    takeoff_time: 5.0           # s  = energy_params mode_switch.takeoff_time
    landing_time: 4.0           # s  = energy_params mode_switch.landing_time
    flight_speed: 0.5           # m/s = energy_params air_mode.speed

    # 비행 중 지상 컨트롤러 묶기 (목표를 취소하지 않고 속도만 제한)
    # ⚠ 0 은 쓰면 안 된다 — Nav2 에서 speed_limit 0.0 은 '제한 해제' 다.
    flight_speed_limit_pct: 1.0   # % of max
    speed_limit_topic: "/speed_limit"

    # ===== 비행 뒤 위치추정 재설정 ("SLAM 재개") =====
    # set_pose 로 로봇을 옮기면 EKF 가 따라오지 못한다 — 순간이동은 IMU 에
    # 가속도를 남기지 않아 EKF 가 걸러낸다. 그러면 TF 가 옛 자리를 가리키고
    # Nav2 가 로봇이 안 움직였다고 믿어 목표를 포기한다 (실측 확인).
    reset_localization_after_flight: true
    ekf_set_pose_service: "/set_pose"

    # 비행 중 SLAM 정지 (인터페이스 규약 ①: "비행 중 정지, 착륙 후 재보정")
    # 순간이동으로 스캔이 2.3 m 점프하면 slam_toolbox 가 매칭을 포기하고
    # map->odom 을 옛 타임스탬프로 계속 재발행한다. TF 가 그걸 거부하면
    # (TF_OLD_DATA) Nav2 전체가 변환을 못 얻어 목표를 포기한다 (실측 확인).
    pause_slam_during_flight: true
    slam_pause_service: "/slam_toolbox/pause_new_measurements"
