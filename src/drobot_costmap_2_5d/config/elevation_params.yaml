# 2.5D Elevation Costmap Layer 파라미터
#
# ⚠️ 이 파일은 런타임에 로드되지 않는다 (참조/문서용).
#    costmap 이 실제로 쓰는 값은 bringup 의 nav2_params_hybrid*.yaml 에
#    elevation_layer 로 인라인돼 있다 (Nav2 플러그인 파라미터는 costmap 노드
#    네임스페이스 아래에 있어야 해서 별도 파일 참조가 안 된다).
#    여기 값을 바꿔도 시뮬 동작은 안 바뀐다 — nav2_params 쪽을 고쳐야 한다.
#    (test_maps.py 등 오프라인 도구가 높이 임계값을 참조할 수 있으므로 유지한다.)
#
# 키 이름은 ElevationLayer::onInitialize() 가 읽는 이름과 일치한다.
#
# Nav2 costmap 설정에 넣을 때는 레이어 이름 아래로 들어간다:
#     global_costmap:
#       global_costmap:
#         ros__parameters:
#           plugins: ["static_layer", "elevation_layer", "inflation_layer"]
#           elevation_layer:
#             plugin: "drobot_costmap_2_5d::ElevationLayer"
#             <아래 항목들>

elevation_layer:
  ros__parameters:
    enabled: true

    # ===== 높이 분류 임계값 =====
    # 4단계: Free / Rover-traversable / Fly-over / Impassable
    height_thresholds:
      rover_traversable_max: 0.15    # m — 이 이하는 바퀴로 넘을 수 있음
      fly_over_max: 1.55             # m — 천장 제약에서 유도 (아래 '주의'). 매니페스트 초안은 2.0
      # fly_over_max 초과 → Impassable

    # 천장 높이 — Impassable 판정 기준
    #   장애물높이 + min_flight_clearance + robot_height + min_ceiling_clearance > ceiling_height
    #   -> Impassable
    #   플래너(airOkAt·z_max)와 오프라인 벤치마크(cost/energy.py max_flight_altitude)와 같은 모델이다.
    ceiling_height: 2.5              # m

    # 비행 중 로봇 몸체 높이, 장애물 윗면과 로봇 바닥 사이 최소 여유, 로봇 윗면과 천장 사이 여유.
    # 플래너의 energy_model.robot.height · min_flight_clearance · robot.ceiling_margin 과 같아야
    # costmap 분류와 플래너 판단이 일치한다 (drobot_bringup/test/test_param_consistency.py).
    robot_height: 0.25               # m  ← SSOT: drobot_description/config/robot_physical.yaml
    min_flight_clearance: 0.2        # m  ← SSOT: robot_physical.yaml
    min_ceiling_clearance: 0.5       # m  ← SSOT: robot_physical.yaml
    #
    # 주의: 위 값으로 계산하면 넘을 수 있는 가장 높은 장애물은
    #       2.5 - 0.5 - 0.25 - 0.2 = 1.55m 다. fly_over_max 를 이보다 크게 두면
    #       그 구간이 fly-over 로 분류되지만 실제로는 넘을 수 없다 (레이어가 시작할 때 경고한다).
    #       이력: 매니페스트 초안 2.0 → 1.2 ('장애물 + 비행고도 0.8 + 여유 0.5', 플래너와 다른
    #       모델) → 1.55 (2026-11-20, 플래너·벤치마크 모델로 통일).

    # ===== Traversability 판단 지표 =====
    traversability:
      # 1. 경사도 — 3x3 이웃 최소자승 평면 피팅 → 법선 각도
      max_slope_angle: 15.0          # degrees
      # 2. 거칠기 — 셀 내 고도 표준편차
      max_roughness: 0.03            # m
      # 3. 단차 — 인접 셀 간 고도 차이
      max_step_height: 0.05          # m
      # 주의: Phase 2에서 실물 드로봇으로 실측 후 보정 필요

    # ===== Cost 값 매핑 =====
    # Nav2 costmap 은 0~255 범위
    cost_values:
      free: 0
      rover_traversable: 100         # 주행 가능하지만 지형이 거칠어 에너지 증가
      fly_over: 200                  # 비행 필요 — 플래너가 모드 전환 판단
      impassable: 254                # LETHAL — 통과 불가

    # ===== 센서 입력 =====
    use_pointcloud: true
    use_laserscan: true
    depth_topic: "/camera/depth/points"   # sensor_msgs/PointCloud2
    scan_topic: "/scan"                   # sensor_msgs/LaserScan

    # 포인트 필터
    min_obstacle_height: -0.5        # m — 이보다 낮은 점은 노이즈로 간주
    max_obstacle_height: 3.0         # m — 천장 위는 무시
    max_sensor_range: 4.0            # m — D435i depth 유효 범위

    # ===== 동작 =====
    # 디버그용 높이맵 퍼블리시 (<layer>/elevation_grid, OccupancyGrid).
    # 높이를 0~100으로 스케일링해서 RViz에서 볼 수 있게 한다.
    publish_elevation_grid: false
    # costmap clear 요청 시 누적 높이도 지울 것인가
    clear_on_reset: true
