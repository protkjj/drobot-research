# 2.5D Elevation Costmap Layer 파라미터
#
# 이 파일의 키 이름은 ElevationLayer::onInitialize() 가 읽는 이름과
# 정확히 일치해야 한다. 불일치하면 조용히 기본값이 쓰인다.
#
# Nav2 costmap 설정에 넣을 때는 레이어 이름 아래로 들어간다:
#     global_costmap:
#       global_costmap:
#         ros__parameters:
#           plugins: ["static_layer", "elevation_layer", "inflation_layer"]
#           elevation_layer:
#             plugin: "drobot_costmap_2_5d::ElevationLayer"
#             <아래 항목들>

elevation_layer:
  ros__parameters:
    enabled: true

    # ===== 높이 분류 임계값 =====
    # 4단계: Free / Rover-traversable / Fly-over / Impassable
    height_thresholds:
      rover_traversable_max: 0.15    # m — 이 이하는 바퀴로 넘을 수 있음
      fly_over_max: 2.0              # m — 이 이하는 비행으로 넘을 수 있음
      # fly_over_max 초과 → Impassable

    # 천장 높이 — Impassable 판정 기준
    #   장애물높이 + robot_flight_height + min_ceiling_clearance > ceiling_height
    #   -> Impassable
    ceiling_height: 2.5              # m

    # 로봇이 비행할 때의 고도(장애물 위 여유)와 천장 여유.
    # drobot_hybrid_planner 의 flight_clearance 와 같은 값을 써야
    # costmap 분류와 플래너 판단이 일치한다.
    robot_flight_height: 0.8         # m
    min_ceiling_clearance: 0.5       # m
    #
    # 주의: 위 세 값으로 계산하면 실제 통과 가능 높이는
    #       2.5 - 0.8 - 0.5 = 1.2m 다.
    #       fly_over_max(2.0)가 이보다 크므로 1.2~2.0m 구간은
    #       fly-over로 분류되지만 실제로는 넘을 수 없다.
    #       레이어가 시작할 때 이 불일치를 경고로 남긴다.

    # ===== Traversability 판단 지표 =====
    traversability:
      # 1. 경사도 — 3x3 이웃 최소자승 평면 피팅 → 법선 각도
      max_slope_angle: 15.0          # degrees
      # 2. 거칠기 — 셀 내 고도 표준편차
      max_roughness: 0.03            # m
      # 3. 단차 — 인접 셀 간 고도 차이
      max_step_height: 0.05          # m
      # 주의: Phase 2에서 실물 드로봇으로 실측 후 보정 필요

    # ===== Cost 값 매핑 =====
    # Nav2 costmap 은 0~255 범위
    cost_values:
      free: 0
      rover_traversable: 100         # 주행 가능하지만 지형이 거칠어 에너지 증가
      fly_over: 200                  # 비행 필요 — 플래너가 모드 전환 판단
      impassable: 254                # LETHAL — 통과 불가

    # ===== 센서 입력 =====
    use_pointcloud: true
    use_laserscan: true
    depth_topic: "/camera/depth/points"   # sensor_msgs/PointCloud2
    scan_topic: "/scan"                   # sensor_msgs/LaserScan
    #
    # 주의: 현재 ros_gz_bridge.yaml 은 depth를 Image(/camera/depth_image_raw)로만
    #       브리지한다. PointCloud2 항목이 없으므로 이 토픽이 존재하지 않는다.
    #       gz 토픽 /camera/points 를 PointCloud2로 브리지하는 항목을 추가해야 한다.

    # 포인트 필터
    min_obstacle_height: -0.5        # m — 이보다 낮은 점은 노이즈로 간주
    max_obstacle_height: 3.0         # m — 천장 위는 무시
    max_sensor_range: 4.0            # m — D435i depth 유효 범위

    # ===== 동작 =====
    # 디버그용 높이맵 퍼블리시 (<layer>/elevation_grid, OccupancyGrid).
    # 높이를 0~100으로 스케일링해서 RViz에서 볼 수 있게 한다.
    publish_elevation_grid: false
    # costmap clear 요청 시 누적 높이도 지울 것인가
    clear_on_reset: true
