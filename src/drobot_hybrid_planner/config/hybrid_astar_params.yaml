# Hybrid A* 플래너 파라미터
# Nav2 GlobalPlanner 플러그인으로 로드 시 사용
# 모든 파라미터는 실험 시 sweep 가능하도록 yaml로 분리
#
# 알고리즘 선택 근거: benchmark/RESEARCH_LOG.md
#   3D 상태공간 (x, y, mode) 에서 A*가 2초 제약 안에 최적해를 낸다 (0.12~1.00초).
#   RRT*는 같은 시간에 근사해이고 실행마다 결과가 다르다 (표준편차 0.25~0.73).
#   해 품질 차이는 1~3%로 작지만, 최적성 보장 / 결정론적 재현성 /
#   튜닝 부담이 적다는 점에서 A*를 택했다.

planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "drobot_hybrid_planner::HybridAStarPlanner"

      # ===== 종료 조건 =====
      # Nav2 글로벌 플래너 응답 시간 제약. 벤치마크에서 A*는
      # 최대 맵(24x16m, 격자 10cm)에서도 1.00초에 완료했다.
      timeout: 2.0                     # seconds
      max_expansions: 2000000          # 타임아웃 백스톱 (상태수 상한)

      # ===== 이동 방식 (modal) =====
      # 장애물을 만났을 때 '어떻게 넘어가느냐'로 나뉜다.
      #
      #   modal          우회   밟고넘기   비행
      #   ------------------------------------
      #   rover_detour    O       X        X    장애물을 피해 돌아간다
      #   rover_climb     O       O        X    낮은 장애물은 타고 넘는다
      #   hybrid          O       X        O    드론으로 전환해 날아 넘는다
      #
      # 셋이 같은 비용 함수를 쓰므로 결과를 직접 비교할 수 있다.
      # 밟고넘기 한계 높이는 energy_params.yaml 의 climb_mode.max_height (0.7m).
      #
      # 주의: 이 값을 바꾸면 같은 맵에서도 완전히 다른 경로가 나온다.
      #       세 modal 의 에너지를 비교하는 게 실험의 목적이므로,
      #       실험 스크립트가 이 파라미터만 바꿔가며 3회 실행하는 구조를 쓴다.
      modal: "hybrid"

      # ===== 상태공간 =====
      # 3D: (x, y, mode).  mode = 0(ground) / 1(air)
      # 비행 고도는 탐색 변수가 아니라 '지형높이 + flight_clearance'로 자동 결정된다.
      #
      # 4D (x, y, z, mode)로 확장하면 고도를 최적화할 수 있고
      # 통과 가능 장애물 높이가 0.95m -> 1.55m 로 넓어지지만,
      # 상태공간이 25만~277만 노드가 되어 A*가 2초 제약을 지키지 못한다
      # (가장 거친 z해상도 0.5m에서도 3.75~4.97초). 확장 시 알고리즘 재검토 필요.
      state_space_dimension: 3

      # ===== 이웃 생성 =====
      # 8방향 이동. 대각선 이동 시 인접한 두 직교 셀이 모두 통과 가능해야 한다
      # (corner-cutting 방지 — 이 검사가 없으면 벽 모서리를 관통하는 경로가 나온다)
      allow_diagonal: true
      check_diagonal_corners: true     # false로 두면 물리적으로 불가능한 경로 발생

      # ===== 비행 제약 =====
      # 비행 고도 = 장애물 높이 + flight_clearance
      flight_clearance: 0.8            # m — 장애물 위 최소 여유
      # 주의: energy_params.yaml 의 ground_effect.activation_height(0.5)보다 크면
      #       ground effect 보정이 영원히 발동하지 않는다. 현재가 그 상태다.

      # 한 번의 비행 구간 최대 거리
      max_flight_segment: 5.0          # meters

      # 최대 상승/하강 각도 — 격자 해상도와 무관하게 물리 제약으로 정의한다.
      # 격자 칸수로 제한하면 해상도에 따라 실질 경사가 달라지는 버그가 생긴다.
      max_climb_angle: 45.0            # degrees

      # ===== 휴리스틱 =====
      # admissible 해야 최적성이 보장된다.
      # 지상 주행 단가(가장 싼 이동 수단)로 하한을 잡는다:
      #   alpha * ground_wh_per_m + gamma / ground_speed
      # 8방향 이동이므로 옥타일 거리를 쓴다 (유클리드보다 타이트).
      heuristic_type: "octile"         # octile / euclidean / manhattan
      # 1.0 초과로 두면 weighted A* (빠르지만 최적성 포기).
      # 벤치마크에서 A*가 시간 여유가 충분했으므로 1.0을 쓴다.
      heuristic_weight: 1.0

      # ===== 경로 최적화 =====
      # 격자 A*는 이동 각도가 45도 배수로 제한되므로 후처리가 필요하다.
      # 스무딩 없이는 연속 공간 플래너 대비 약 5% 손해를 본다.
      smooth_path: true
      smoothing_max_passes: 30
      # 모드 전환 지점(이/착륙)은 스무딩으로 건너뛰지 않는다.
      # 이착륙은 '같은 위치에서만' 허용되는 전이라, 잘라내면 무효 경로가 된다.

      # ===== 디버그 =====
      publish_expansions: false        # true면 탐색 확장 노드를 마커로 퍼블리시
      publish_mode_switch_plan: true   # /mode_switch_points (drobot_msgs/ModeSwitchPlan)
