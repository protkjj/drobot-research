# 벤치마크 전용 추가 가정
# ------------------------------------------------------------------
# src/drobot_hybrid_planner/config/energy_params.yaml 에 "없는" 값들만 여기 둔다.
# 이유: 어디까지가 kj가 정의한 모델이고 어디부터가 벤치마크를 돌리기 위해
#       내가 임의로 채운 값인지 구분되어야, 나중에 결과를 해석할 때
#       "이 결론이 내 가정에 얼마나 의존하는가"를 따질 수 있기 때문.
#
# 전부 Phase 2 INA226 실측으로 교체 대상.

assumptions:
  # ===== 1. 비행 중 수직 이동 비용 =====
  # energy_params.yaml의 energy_per_altitude_meter(2.0 Wh/m)는
  # "이착륙" 비용으로만 정의되어 있고, 비행 도중 고도를 바꾸는 비용은 정의가 없다.
  # 4D (x,y,z,m) 실험에서는 이 값이 반드시 필요하므로 여기서 정의한다.
  vertical_motion:
    # 상승: 이착륙과 동일한 비율을 적용 (2.0 Wh/m)
    climb_energy_per_meter: 2.0      # Wh/m
    # 하강: 상승보다 싸다. 쿼드로터는 하강 시에도 호버링에 준하는 전력을 쓰므로 0은 아님.
    # 상승 대비 비율로 표현 — 민감도 분석 대상.
    descent_energy_ratio: 0.3        # 하강 비용 = 0.3 * 상승 비용
    # 수직 이동 속도 (시간 항 T 계산용)
    climb_speed: 0.5                 # m/s
    descent_speed: 0.5               # m/s

  # ===== 2. 착륙 시 고도 비용 적용 여부 =====
  # energy_params.yaml 주석: "고도별 추가 에너지 — 높이 올라갈수록 이착륙 비용 증가"
  # → 이착륙 = takeoff AND landing 으로 읽어서 양쪽 다 적용한다.
  # 물리적으로는 하강이 상승보다 싸야 하지만, 원본 config의 문언을 존중.
  # false로 바꾸면 착륙에는 고도 비용을 안 매긴다 (민감도 분석용).
  apply_altitude_cost_to_landing: true

  # ===== 3. 로봇 형상 (천장 제약 계산용) =====
  # elevation_params.yaml: "장애물 높이 + 로봇 비행 고도 + 천장 여유(50cm) > ceiling_height → Impassable"
  # 여기서 '로봇 높이'가 URDF에 명시적으로 없어 추정치를 쓴다.
  robot:
    height: 0.25                     # m — drobot 본체 높이 추정
    ceiling_margin: 0.5              # m — elevation_params.yaml의 천장 여유와 동일

  # ===== 4. 최소 비행 고도 =====
  # 이륙했으면 최소한 이만큼은 떠야 한다 (지면 접촉 방지)
  min_flight_clearance: 0.2          # m — 아래 지형 상단으로부터

  # ===== 5. 최대 상승/하강 각도 =====
  # 왜 필요한가:
  #   4D 이웃 생성에서 고도 변경을 '격자 한 칸'으로 제한했더니,
  #   z해상도가 촘촘할수록 최대 경사가 얕아지는 버그가 생겼다.
  #     z=0.10m -> 수평 0.1m당 고도 0.1m -> 45도
  #     z=0.05m -> 수평 0.1m당 고도 0.05m -> 26.6도
  #   실제 드론의 상승각은 격자 해상도와 무관해야 하므로,
  #   물리 제약을 '각도'로 정의하고 격자 칸수는 거기서 역산한다.
  #
  # 45도는 쿼드로터에게 보수적인 값이다 (실제로는 더 가파르게도 가능).
  # 이 값이 결과에 미치는 영향은 민감도 분석 대상.
  max_climb_angle_deg: 45.0          # degrees
